
name: Test Nova AI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Nova AI code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check index.js

      - name: Test Nova AI endpoints
        run: |
          node index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:3000/api/health
          curl -fsS -X POST \
            http://localhost:3000/api/core \
            -H "Content-Type: application/json" \
            -d '{"question":"How can a small business reach more customers?","mode":"all"}' \
            -o response.json

          grep -q '"success": true' response.json
          echo "Nova AI tests passed."
          
