name: Test Nova AI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript files
        run: |
          node --check index.js
          node --check storage.js
          node --check experiments.js
          node --check knowledge.js
          node --check evidence.js

      - name: Start Nova AI backend
        run: |
          node index.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > health.json; then
              echo "Nova AI started successfully."
              cat health.json
              exit 0
            fi

            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "Nova AI stopped unexpectedly."
              cat server.log
              exit 1
            fi

            sleep 1
          done

          echo "Nova AI failed to start."
          cat server.log
          exit 1

      - name: Test core endpoint
        run: |
          curl --fail-with-body -sS \
            -X POST http://127.0.0.1:3000/api/core \
            -H "Content-Type: application/json" \
            -d '{"question":"Test Nova AI","mode":"all"}' \
            -o core.json

          node -e "
            const r = require('./core.json');
            if (!r.success || !r.result || !r.result.opportunityDiscovery || !r.result.novaGenesis) {
              console.error('Core endpoint response is invalid:', r);
              process.exit(1);
            }
            console.log('Core endpoint passed.');
          "

      - name: Show logs if test fails
        if: failure()
        run: |
          if [ -f server.log ]; then
            cat server.log
          fi
