
name: Test Nova AI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Nova AI backend
        run: |
          node index.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server and test
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/api/health

          curl -fsS -X POST \
            http://127.0.0.1:3000/api/core \
            -H "Content-Type: application/json" \
            -d '{"question":"Test Nova AI","mode":"all"}'

      - name: Show server logs if test fails
        if: failure()
        run: cat server.log
        
